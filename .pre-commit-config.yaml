# Pre-commit hooks for git-pluck

repos:
  - repo: local
    hooks:
      # One-time install (if not done yet):
      #   uv tool install pre-commit
      #   pre-commit install
      - id: rustfmt-check
        name: rustfmt (format check .rs files)
        language: system
        entry: tools/rustfmt_check.sh
        files: '\.rs$'
