name: CI

# Triggers:
#   - push to master        -> keeps the README badge current for "latest master build"
#   - PR targeting master   -> check proposed changes before they land
#   - nightly schedule      -> catch bit-rot on master even when no new PRs arrive
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # GitHub Actions cron is evaluated in UTC, not local time.
    # 23:00 UTC == midnight CET (winter). During summer (CEST, UTC+2) this fires at 01:00 local.
    - cron: '0 23 * * *'

# Minimal token scope: we only read the repo (checkout + cache reads).
permissions:
  contents: read

# Shared across all jobs so adding a new job/leg stays consistent.
env:
  IMAGE_NAME: git-pluck-ci

# ---------------------------------------------------------------------------
# Design: "ready to grow"
#   - Each test runs in its OWN container (isolated target dir -> parallelizable).
#   - The expensive bits are cached and SHARED across all containers/runs:
#       * the Docker image  -> GHA layer cache (built once, reused everywhere)
#       * downloaded crates -> ONE actions/cache on cargo's registry (Cargo.lock key)
#   Add a new check by extending the matrix below (or adding a job); it reuses both caches.
# ---------------------------------------------------------------------------
jobs:
  test:
    name: Test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      # Let every leg finish even if one fails, so you see all results at once.
      fail-fast: false
      matrix:
        profile: [debug, release]
        # Grow by adding axes, e.g. `rust-version: [1.93, 1.94, 1.95]`.
        # Caveat: the devcontainer image bakes a single toolchain (1.95.0), so a version
        # axis needs either a per-version image build ARG or a rustup install inside the job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the exact devcontainer image. Layers are cached in GHA, so this is fast on
      # every run after the first and shared across the parallel jobs.
      - name: Build devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ONE shared crate cache. Keyed on Cargo.lock so it is reused by every job and run;
      # restore-keys falls back to the most recent cache when dependencies change.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Each leg runs in its own container. The registry is mounted from the shared cache,
      # so isolated containers still share downloaded crates instead of each re-downloading.
      - name: Run tests
        run: |
          mkdir -p "${{ runner.temp }}/cargo-registry"
          release_flag=""
          if [ "${{ matrix.profile }}" = "release" ]; then release_flag="--release"; fi

          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ runner.temp }}/cargo-registry:/usr/local/cargo/registry" \
            -e CARGO_TARGET_DIR=/tmp/target \
            -w /workspace \
            ${{ env.IMAGE_NAME }}:latest \
            -c "cargo test $release_flag"
