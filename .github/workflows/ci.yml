name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 23:00 UTC == midnight CET (winter). During summer (CEST, UTC+2) 01:00 CET.
    - cron: '0 23 * * *'

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Design:
#   - Each test runs in its OWN container.
#   - Caching and sharing across all containers/runs:
#       * the Docker image  -> GHCR, tagged by content hash
#       * downloaded crates -> ONE actions/cache on cargo's registry (Cargo.lock key)
#       * compiled output   -> ONE actions/cache on cargo's target dir (per profile)
#   Add a new check by extending the matrix below (or adding a job); it reuses all the caches.
# ---------------------------------------------------------------------------
jobs:
  # Make sure the devcontainer image is on GHCR under its content-hash tag — building only when
  # that tag doesn't exist yet (a warm run skips straight past).
  build-image:
    name: Build devcontainer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image refs
        id: img
        run: |
          # GHCR requires a lowercase repository; use tr for now.
          # WARNING: it hashes files only, not the floating `ubuntu:24.04` of the DOCKERFILE base or apt/rustup downloads;
          # TODO: pin the base by digest in the Dockerfile if byte-for-byte determinism is required.
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          tag="${{ hashFiles('.devcontainer/**') }}"
          echo "ref=ghcr.io/${repo}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already on GHCR
        id: exists
        run: |
          if docker buildx imagetools inspect "${{ steps.img.outputs.ref }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # push=false on fork PRs (their read-only token can't write the base repo's packages);
      # the build still runs locally to validate the Dockerfile, it just doesn't share a new image.
      # Same-repo branches/PRs and pushes still push.
      - name: Build and push devcontainer image
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          tags: ${{ steps.img.outputs.ref }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
      packages: read   # needed to pull the (private) image from GHCR
    strategy:
      # Let every leg finish even if one fails, so one sees all results at once.
      fail-fast: false
      matrix:
        profile: [debug, release]
        # Grow by adding axes, e.g. `rust-version: [1.93, 1.94, 1.95]`.
        # Caveat: the devcontainer image bakes a single toolchain (1.95.0), so a version
        # axis needs either a per-version image build ARG or a rustup install inside the job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image refs
        id: img
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          tag="${{ hashFiles('.devcontainer/**') }}"
          echo "ref=ghcr.io/${repo}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image
        run: docker pull "${{ steps.img.outputs.ref }}"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Compiled-artifact cache.
      # Keyed per profile — debug and release produce different artifacts and
      # must not share an entry — plus Cargo.lock and the pinned toolchain.
      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-cargo-target-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ matrix.profile }}-

      # Ownership: the image has no USER, so this runs as root (uid 0). libgit2 refuses to
      # open a repo whose owner uid != the process euid, and the bind-mounted /workspace is
      # owned by the host runner user (uid 1001 on GHA), not root. chowning it to root first
      # (chown -R 0:0) makes the uids match so tests can open /workspace as a repository.
      - name: Run tests
        run: |
          mkdir -p "${{ runner.temp }}/cargo-registry" "${{ runner.temp }}/cargo-target"
          release_flag=""
          if [ "${{ matrix.profile }}" = "release" ]; then release_flag="--release"; fi

          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ runner.temp }}/cargo-registry:/usr/local/cargo/registry" \
            -v "${{ runner.temp }}/cargo-target:/tmp/target" \
            -e CARGO_TARGET_DIR=/tmp/target \
            -w /workspace \
            ${{ steps.img.outputs.ref }} \
            -c "chown -R 0:0 /workspace && cargo test $release_flag"
