name: CI

# Triggers:
#   - push to master        -> keeps the README badge current for "latest master build"
#   - PR targeting master   -> check proposed changes before they land
#   - nightly schedule      -> catch bit-rot on master even when no new PRs arrive
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # GitHub Actions cron is evaluated in UTC, not local time.
    # 23:00 UTC == midnight CET (winter). During summer (CEST, UTC+2) this fires at 01:00 local.
    - cron: '0 23 * * *'

# Baseline token scope. Jobs that talk to GHCR override this with the package scopes they need.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Image identity = a hash of the build inputs (.devcontainer/**), NOT the branch.
#   The image is a build ENVIRONMENT (OS + Rust + libs); your code is mounted in at runtime,
#   so it's identical across every branch/PR unless someone edits .devcontainer/. Same content
#   -> same tag -> one shared image on GHCR reused by all of them. Computed automatically in each
#   job (in a step AFTER checkout, because hashFiles needs the files present) — no manual tagging.
#   Note: it hashes OUR files only, not the floating `ubuntu:24.04` base or apt/rustup downloads;
#   pin the base by digest in the Dockerfile if you want byte-for-byte determinism.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Design: "ready to grow"
#   - Each test runs in its OWN container (isolated target dir -> parallelizable).
#   - The expensive bits are cached and SHARED across all containers/runs:
#       * the Docker image  -> GHCR, tagged by content hash (durable; no 7-day eviction)
#       * downloaded crates -> ONE actions/cache on cargo's registry (Cargo.lock key)
#       * compiled output   -> ONE actions/cache on cargo's target dir (per profile)
#   Add a new check by extending the matrix below (or adding a job); it reuses all the caches.
# ---------------------------------------------------------------------------
jobs:
  # Build the devcontainer image ONCE per run and make sure it's on GHCR under its content-hash
  # tag. Using GHCR as buildx's layer cache means a warm run restores layers from the registry
  # (no apt/rustup) even after GitHub's 7-day GHA layer-cache eviction. Test jobs `needs:` this,
  # so the image is guaranteed to exist before they pull it.
  build-image:
    name: Build devcontainer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push; fork PRs get a read-only token and skip the push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # hashFiles() must run after checkout (top-level env is evaluated before it, so we can't
      # compute the tag there). Every job checks out the same .devcontainer/** -> same refs.
      - name: Resolve image refs
        id: img
        run: |
          # GHCR requires a lowercase repository; GHA has no case function, so use tr.
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          tag="${{ hashFiles('.devcontainer/**') }}"
          echo "ref=ghcr.io/${repo}:${tag}" >> "$GITHUB_OUTPUT"
          echo "cache_ref=ghcr.io/${repo}:${tag}-cache" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push=false on fork PRs (their read-only token can't write the base repo's packages). The
      # build still runs locally so this job validates the Dockerfile; it just doesn't share a new
      # image. Same-repo branches/PRs and pushes all push normally.
      - name: Build and push devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          tags: ${{ steps.img.outputs.ref }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.img.outputs.cache_ref }}
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ steps.img.outputs.cache_ref }},mode=max

  test:
    name: Test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
      packages: read   # needed to pull the (private) image from GHCR
    strategy:
      # Let every leg finish even if one fails, so you see all results at once.
      fail-fast: false
      matrix:
        profile: [debug, release]
        # Grow by adding axes, e.g. `rust-version: [1.93, 1.94, 1.95]`.
        # Caveat: the devcontainer image bakes a single toolchain (1.95.0), so a version
        # axis needs either a per-version image build ARG or a rustup install inside the job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image refs
        id: img
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          tag="${{ hashFiles('.devcontainer/**') }}"
          echo "ref=ghcr.io/${repo}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-image already pushed this exact tag, so this is a plain pull of the shared image.
      # (No buildx needed here — we only pull and run.)
      - name: Pull devcontainer image
        run: docker pull "${{ steps.img.outputs.ref }}"

      # ONE shared crate cache. Keyed on Cargo.lock so it is reused by every job and run;
      # restore-keys falls back to the most recent cache when dependencies change.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Compiled-artifact cache. The registry cache only saves crate *downloads*; this saves
      # the *build* output, so a warm run skips recompiling dependencies entirely (usually the
      # biggest time sink in a Rust CI). Keyed per profile — debug and release produce different
      # artifacts and must not share an entry — plus Cargo.lock and the pinned toolchain, so a
      # dependency or Rust change invalidates it. restore-keys reuses most deps when only some
      # sources changed.
      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-target
          key: ${{ runner.os }}-cargo-target-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ matrix.profile }}-

      # Each leg runs in its own container. The registry and target dir are mounted from the
      # shared caches, so isolated containers reuse downloaded crates and compiled artifacts
      # instead of each re-downloading / recompiling.
      #
      # Ownership: the image has no USER, so this runs as root (uid 0). libgit2 refuses to
      # open a repo whose owner uid != the process euid, and the bind-mounted /workspace is
      # owned by the host runner user (uid 1001 on GHA), not root. chowning it to root first
      # makes the uids match so tests can open /workspace as a repository.
      - name: Run tests
        run: |
          mkdir -p "${{ runner.temp }}/cargo-registry" "${{ runner.temp }}/cargo-target"
          release_flag=""
          if [ "${{ matrix.profile }}" = "release" ]; then release_flag="--release"; fi

          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ runner.temp }}/cargo-registry:/usr/local/cargo/registry" \
            -v "${{ runner.temp }}/cargo-target:/tmp/target" \
            -e CARGO_TARGET_DIR=/tmp/target \
            -w /workspace \
            ${{ steps.img.outputs.ref }} \
            -c "chown -R 0:0 /workspace && cargo test $release_flag"
